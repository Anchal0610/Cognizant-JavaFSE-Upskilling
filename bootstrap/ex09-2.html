<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Groups</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h1>Button Groups</h1>

        <h2>Horizontal Button Group</h2>
        <div class="btn-group mb-3" role="group">
            <button class="btn btn-primary">Left</button>
            <button class="btn btn-primary">Middle</button>
            <button class="btn btn-primary">Right</button>
        </div>

        <h2>Vertical Button Group</h2>
        <div class="btn-group-vertical mb-3" role="group">
            <button class="btn btn-success">Top</button>
            <button class="btn btn-success">Center</button>
            <button class="btn btn-success">Bottom</button>
        </div>

        <h2>Button Toolbar</h2>
        <div class="btn-toolbar mb-3" role="toolbar">
            <div class="btn-group me-2" role="group">
                <button class="btn btn-outline-secondary">1</button>
                <button class="btn btn-outline-secondary">2</button>
                <button class="btn btn-outline-secondary">3</button>
            </div>
            <div class="btn-group me-2" role="group">
                <button class="btn btn-outline-secondary">4</button>
                <button class="btn btn-outline-secondary">5</button>
            </div>
            <div class="btn-group" role="group">
                <button class="btn btn-outline-secondary">6</button>
            </div>
        </div>

        <h2>Toggle Buttons (Checkbox)</h2>
        <div class="btn-group" role="group">
            <input type="checkbox" class="btn-check" id="check1" autocomplete="off">
            <label class="btn btn-outline-primary" for="check1">Option A</label>
            <input type="checkbox" class="btn-check" id="check2" autocomplete="off">
            <label class="btn btn-outline-primary" for="check2">Option B</label>
            <input type="checkbox" class="btn-check" id="check3" autocomplete="off">
            <label class="btn btn-outline-primary" for="check3">Option C</label>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
