<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon-Only Buttons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <div class="container pt-4">
    <h1>Icon-Only Buttons</h1>

    <h2 class="mt-4">Toolbar with Icon-Only Buttons</h2>
    <div class="btn-toolbar mb-4" role="toolbar" aria-label="Icon-only toolbar">
      <div class="btn-group me-2" role="group">
        <button type="button" class="btn btn-outline-secondary" aria-label="Edit">
          <i class="bi bi-pencil"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary" aria-label="Delete">
          <i class="bi bi-trash"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary" aria-label="Save">
          <i class="bi bi-check-lg"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
        <button type="button" class="btn btn-outline-secondary" aria-label="Settings">
          <i class="bi bi-gear"></i>
        </button>
      </div>
    </div>

    <h2 class="mt-5">Text + Icon Buttons (for comparison)</h2>
    <div class="btn-group" role="group">
      <button type="button" class="btn btn-outline-primary">
        <i class="bi bi-pencil me-1"></i> Edit
      </button>
      <button type="button" class="btn btn-outline-danger">
        <i class="bi bi-trash me-1"></i> Delete
      </button>
      <button type="button" class="btn btn-outline-success">
        <i class="bi bi-check-lg me-1"></i> Save
      </button>
      <button type="button" class="btn btn-outline-secondary">
        <i class="bi bi-x-lg me-1"></i> Close
      </button>
      <button type="button" class="btn btn-outline-info">
        <i class="bi bi-gear me-1"></i> Settings
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
