<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Pill</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h1 class="mb-4">Shadows and Pill</h1>

    <h3 class="mb-3">Shadow Comparison</h3>
    <div class="row g-3 mb-5">
      <div class="col-md-4">
        <div class="card shadow-sm p-4 text-center">
          <h5>shadow-sm</h5>
          <p class="mb-0 text-muted">Small shadow</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow p-4 text-center">
          <h5>shadow</h5>
          <p class="mb-0 text-muted">Regular shadow</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-lg p-4 text-center">
          <h5>shadow-lg</h5>
          <p class="mb-0 text-muted">Large shadow</p>
        </div>
      </div>
    </div>

    <h3 class="mb-3">Rounded Pill Examples</h3>
    <div class="mb-3">
      <button class="btn btn-primary rounded-pill px-4 py-2">rounded-pill Button</button>
    </div>
    <div class="mb-3">
      <span class="badge bg-success rounded-pill fs-6 px-3 py-2">rounded-pill Badge</span>
    </div>
    <div class="card rounded-pill overflow-hidden" style="max-width: 350px;">
      <div class="bg-primary text-white p-3 text-center">
        <h5 class="mb-0">rounded-pill Card Top</h5>
      </div>
      <div class="p-3">
        <p class="mb-0 text-muted">This card uses rounded-pill on the card element with overflow-hidden to clip the content.</p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
