<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positioned Badge Overlay</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

  <div class="container pt-4">
    <h1>Positioned Badge Overlay</h1>

    <h2 class="mt-4">Card with Badge Overlay</h2>
    <div class="card position-relative" style="width: 18rem;">
      <div class="bg-secondary d-flex align-items-center justify-content-center" style="width: 100%; height: 200px; color: white;">
        Image Placeholder
      </div>
      <span class="badge bg-danger position-absolute top-0 end-0 mt-2 me-2">Sale</span>
      <div class="card-body">
        <h5 class="card-title">Product Card</h5>
        <p class="card-text">This card has a badge overlay on the top-right corner using position-absolute.</p>
      </div>
    </div>

    <h2 class="mt-5">Profile Avatar with Status Indicator</h2>
    <div class="position-relative d-inline-block">
      <div class="bg-secondary rounded-circle d-flex align-items-center justify-content-center" style="width: 80px; height: 80px; color: white; font-size: 2rem;">
        JD
      </div>
      <span class="position-absolute top-100 start-100 translate-middle badge rounded-pill bg-success border border-light border-2" style="width: 20px; height: 20px;">
        <span class="visually-hidden">Online</span>
      </span>
    </div>

    <h2 class="mt-5">Notification Badge with translate-middle</h2>
    <div class="position-relative d-inline-block">
      <i class="bi bi-bell fs-1" style="display: inline-block; width: 48px; height: 48px; background: #eee; border-radius: 4px;"></i>
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        3
        <span class="visually-hidden">unread messages</span>
      </span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
