<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Container, Row, Col Classes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Exercise 3.2 -->
  <div class="container my-5">
    <h1>Container, Row, Col Classes</h1>

    <h2 class="mt-4">Container with 4 Equal Columns</h2>
    <div class="container border mb-5 p-3">
      <div class="row">
        <div class="col">
          <div class="p-3 bg-primary text-white text-center">Equal Col 1</div>
        </div>
        <div class="col">
          <div class="p-3 bg-success text-white text-center">Equal Col 2</div>
        </div>
        <div class="col">
          <div class="p-3 bg-warning text-white text-center">Equal Col 3</div>
        </div>
        <div class="col">
          <div class="p-3 bg-info text-white text-center">Equal Col 4</div>
        </div>
      </div>
    </div>

    <h2>Container-Fluid with 3 Sized Columns</h2>
    <div class="container-fluid border p-3">
      <div class="row">
        <div class="col-4">
          <div class="p-3 bg-danger text-white text-center">col-4</div>
        </div>
        <div class="col-6">
          <div class="p-3 bg-success text-white text-center">col-6</div>
        </div>
        <div class="col-2">
          <div class="p-3 bg-dark text-white text-center">col-2</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
