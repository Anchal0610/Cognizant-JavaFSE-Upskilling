<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Card Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h1>Flexbox Card Layout</h1>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div class="card" style="width: 18rem;">
                <div class="bg-primary" style="height: 100px;"></div>
                <div class="card-body">
                    <h5 class="card-title">Card One</h5>
                    <p class="card-text">Some quick example text for the first card.</p>
                </div>
            </div>
            <div class="card" style="width: 18rem;">
                <div class="bg-success" style="height: 100px;"></div>
                <div class="card-body">
                    <h5 class="card-title">Card Two</h5>
                    <p class="card-text">Some quick example text for the second card.</p>
                </div>
            </div>
            <div class="card" style="width: 18rem;">
                <div class="bg-warning" style="height: 100px;"></div>
                <div class="card-body">
                    <h5 class="card-title">Card Three</h5>
                    <p class="card-text">Some quick example text for the third card.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
