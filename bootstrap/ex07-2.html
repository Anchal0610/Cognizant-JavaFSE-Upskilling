<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Transformation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h1>Text Transformation</h1>

        <p class="text-uppercase">this text is entirely uppercase.</p>
        <p class="text-lowercase">THIS TEXT IS ENTIRELY LOWERCASE.</p>
        <p class="text-capitalize">each word in this sentence starts with a capital letter.</p>

        <p class="text-center">This text is centered.</p>
        <p class="text-end">This text is end-aligned.</p>

        <p class="text-sm-start text-md-center text-lg-end">This text is left on small, centered on medium, right on large screens.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
