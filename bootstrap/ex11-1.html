<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
  <div class="container">
    <h1 class="text-center mb-4">Profile Card</h1>
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <div class="card">
          <div class="bg-secondary d-flex align-items-center justify-content-center" style="height: 300px;">
            <span class="text-white">300x300 Placeholder</span>
          </div>
          <div class="card-body">
            <h5 class="card-title">Alex Johnson</h5>
            <h6 class="card-subtitle mb-2 text-muted">Full Stack Developer</h6>
            <p class="card-text">Passionate about building scalable web applications and exploring new technologies. Open source contributor and tech blogger.</p>
          </div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between"><span>Posts</span><strong>142</strong></li>
            <li class="list-group-item d-flex justify-content-between"><span>Followers</span><strong>3.2K</strong></li>
            <li class="list-group-item d-flex justify-content-between"><span>Following</span><strong>486</strong></li>
          </ul>
          <div class="card-footer d-flex justify-content-between">
            <button class="btn btn-primary">Follow</button>
            <button class="btn btn-outline-secondary">Message</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
