<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reordering Columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Exercise 5.2 -->
  <div class="container my-5">
    <h1>Reordering Columns</h1>
    <p>Default order: A, B, C. On medium screens and up: C, A, B.</p>
    <div class="row">
      <div class="col order-md-2 bg-primary text-white p-4">
        <h3>Col A</h3>
        <p>First in HTML, appears second on medium screens.</p>
      </div>
      <div class="col order-md-3 bg-success text-white p-4">
        <h3>Col B</h3>
        <p>Second in HTML, appears last on medium screens.</p>
      </div>
      <div class="col order-md-1 bg-danger text-white p-4">
        <h3>Col C</h3>
        <p>Third in HTML, appears first on medium screens.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
